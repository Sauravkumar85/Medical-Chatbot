```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Saurav MedAI - Medical Chatbot</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <div class="container-fluid h-100">
        <div class="row justify-content-center h-100">
            <div class="col-md-8 col-xl-6 chat">
                <div class="card">

                    <!-- Chat header -->
                    <div class="card-header msg_head">
                        <div class="d-flex bd-highlight">
                            <div class="img_cont">
                                <img
                                    src="https://cdn-icons-png.flaticon.com/512/387/387569.png"
                                    class="rounded-circle user_img"
                                    alt="Saurav MedAI avatar"
                                >
                                <span class="online_icon"></span>
                            </div>

                            <div class="user_info">
                                <span>Saurav MedAI</span>
                                <p>Your AI-powered health information assistant</p>
                            </div>
                        </div>
                    </div>

                    <!-- Chat messages: one welcome message only -->
                    <div
                        id="messageFormeight"
                        class="card-body msg_card_body"
                        aria-live="polite"
                    >
                        <div class="d-flex justify-content-start mb-4 welcome-row">
                            <div class="img_cont_msg">
                                <img
                                    src="https://cdn-icons-png.flaticon.com/512/387/387569.png"
                                    class="rounded-circle user_img_msg"
                                    alt="Saurav MedAI"
                                >
                            </div>

                            <div class="msg_cotainer welcome-message">
                                Hello, I am Saurav. How can I help you today?
                            </div>
                        </div>
                    </div>

                    <!-- Message input -->
                    <div class="card-footer">
                        <form id="messageArea" class="input-group">
                            <input
                                type="text"
                                id="text"
                                name="msg"
                                placeholder="Ask a medical question..."
                                autocomplete="off"
                                class="form-control type_msg"
                                aria-label="Your message"
                                required
                            >

                            <div class="input-group-append">
                                <button
                                    type="submit"
                                    id="send"
                                    class="input-group-text send_btn"
                                    aria-label="Send message"
                                >
                                    <i class="fas fa-paper-plane"></i>
                                </button>
                            </div>
                        </form>

                        <small class="text-muted d-block mt-2">
                            For general health information only. Not a substitute
                            for professional medical advice.
                        </small>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $("#messageArea").on("submit", function (event) {
                event.preventDefault();

                const input = $("#text");
                const rawText = input.val().trim();

                if (!rawText) {
                    return;
                }

                const date = new Date();
                const strTime = date.toLocaleTimeString([], {
                    hour: "2-digit",
                    minute: "2-digit"
                });

                const messages = $("#messageFormeight");
                const sendButton = $("#send");

                // Display the user's message safely.
                const userRow = $("<div>").addClass(
                    "d-flex justify-content-end mb-4"
                );

                const userBubble = $("<div>")
                    .addClass("msg_cotainer_send")
                    .text(rawText);

                $("<span>")
                    .addClass("msg_time_send")
                    .text(strTime)
                    .appendTo(userBubble);

                userRow.append(userBubble);
                messages.append(userRow);

                input.val("").prop("disabled", true);
                sendButton.prop("disabled", true);

                // Display a temporary loading message.
                const loadingBubble = $("<div>")
                    .addClass("msg_cotainer")
                    .text("Thinking...");

                const loadingRow = $("<div>")
                    .addClass("d-flex justify-content-start mb-4")
                    .append(
                        $("<div>")
                            .addClass("img_cont_msg")
                            .append(
                                $("<img>")
                                    .attr(
                                        "src",
                                        "https://cdn-icons-png.flaticon.com/512/387/387569.png"
                                    )
                                    .addClass("rounded-circle user_img_msg")
                                    .attr("alt", "Saurav MedAI")
                            )
                    )
                    .append(loadingBubble);

                messages.append(loadingRow);
                messages.scrollTop(messages[0].scrollHeight);

                $.ajax({
                    url: "/get",
                    type: "POST",
                    data: { msg: rawText },
                    dataType: "text"
                })
                .done(function (data) {
                    loadingRow.remove();

                    // Display the chatbot reply.
                    const botRow = $("<div>").addClass(
                        "d-flex justify-content-start mb-4"
                    );

                    const botAvatar = $("<div>")
                        .addClass("img_cont_msg")
                        .append(
                            $("<img>")
                                .attr(
                                    "src",
                                    "https://cdn-icons-png.flaticon.com/512/387/387569.png"
                                )
                                .addClass("rounded-circle user_img_msg")
                                .attr("alt", "Saurav MedAI")
                        );

                    const botBubble = $("<div>")
                        .addClass("msg_cotainer")
                        .text(data);

                    $("<span>")
                        .addClass("msg_time")
                        .text(strTime)
                        .appendTo(botBubble);

                    botRow.append(botAvatar, botBubble);
                    messages.append(botRow);
                })
                .fail(function (xhr) {
                    loadingRow.remove();

                    const errorMessage = xhr.responseText ||
                        "Sorry, something went wrong. Please try again.";

                    const errorRow = $("<div>").addClass(
                        "d-flex justify-content-start mb-4"
                    );

                    const errorAvatar = $("<div>")
                        .addClass("img_cont_msg")
                        .append(
                            $("<img>")
                                .attr(
                                    "src",
                                    "https://cdn-icons-png.flaticon.com/512/387/387569.png"
                                )
                                .addClass("rounded-circle user_img_msg")
                                .attr("alt", "Saurav MedAI")
                        );

                    const errorBubble = $("<div>")
                        .addClass("msg_cotainer")
                        .text(errorMessage);

                    errorRow.append(errorAvatar, errorBubble);
                    messages.append(errorRow);
                })
                .always(function () {
                    input.prop("disabled", false).trigger("focus");
                    sendButton.prop("disabled", false);
                    messages.scrollTop(messages[0].scrollHeight);
                });

                messages.scrollTop(messages[0].scrollHeight);
            });
        });
    </script>
</body>
</html>
```
