
services:
  - type: web
    name: medical-chatbot
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
   
startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 600
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: PINECONE_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false